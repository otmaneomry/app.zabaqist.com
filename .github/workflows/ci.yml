# Every check in the repository, on every push — so a regression is caught here
# rather than by a student.
#
# No count is written down. Three different ones used to be: "189" here, "189"
# in prod-check.mjs, "~236" in CLAUDE.md, and all three were stale. Each script
# prints its own total, and that one is true by construction.
#
# ── Credentials ──
# `NEXT_PUBLIC_SUPABASE_*` are placeholders on purpose. The browser suite never
# signs in for real (OAuth cannot be scripted); it uses the `zb-e2e` bypass, and
# the gate fails closed when Supabase is unreachable. Putting the real project's
# keys here would buy nothing for that half and widen their blast radius.
#
# It does cost something, and `db:check` now says so out loud instead of quietly
# passing: with a placeholder host it can verify the DECLARED schema and nothing
# live, so it skips its RLS, anonymous-write, allowlist and signup-hook probes
# and prints "N of M checks ran". If those are ever wanted here, add
# SUPABASE_URL / SUPABASE_PUBLISHABLE_KEY / SUPABASE_SECRET_KEY as repository
# secrets and map them onto the env below; the script reads `process.env` now,
# which the previous version did not — the variables below were decorative.
#
# No `continue-on-error` anywhere, and `prod:check` asserts that. It meant a
# migration that left RLS disabled reported red in the log and green overall,
# and the pipeline went on to build and deploy it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Each ref gets one run. A force-push, or three commits in a minute, used to
# leave two supersed runs finishing a matrix that nobody was going to read —
# and this matrix builds the app twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # This job reads the repository and nothing else. Without the key it runs
    # with whatever the repository default is, which can include
    # `contents: write` — a token with push rights, sitting in the environment
    # while `npm ci` and `next build` run third-party code.
    permissions:
      contents: read

    # Both sides of the indexing switch, because the launch side had never run
    # once. `NEXT_PUBLIC_ALLOW_INDEXING` is baked into the bundle by
    # `next build`, so it cannot be flipped at test time — the whole build has
    # to happen twice, and the suite reads the posture off the running app.
    strategy:
      fail-fast: false
      matrix:
        indexing: ['0', '1']

    name: verify (NEXT_PUBLIC_ALLOW_INDEXING=${{ matrix.indexing }})

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci.invalid
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
      E2E_AUTH_SECRET: ci-only-not-a-secret
      NEXT_PUBLIC_ALLOW_INDEXING: ${{ matrix.indexing }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Types and lint before anything slower.
      - run: npm run check

      # Structure, without the network: the live half skips itself when there
      # are no real credentials, names every check it skipped, and says how many
      # of the checks it declares actually ran.
      - run: npm run db:check

      - run: npm run prod:check

      - run: npm run build

      - name: Install Chrome for Playwright
        run: npx playwright install --with-deps chromium

      - name: Start the built app
        run: |
          npm start -- -p 3111 &
          npx wait-on http://localhost:3111 --timeout 60000

      - run: npm run test:course
